<svg xmlns="http://www.w3.org/2000/svg" width="480" height="800" viewBox="0 0 480 800" role="img" aria-labelledby="title desc">
<title id="title">Offline construction, narrow-screen layout</title><desc id="desc">The same source-pair, language construction, review and structured-record workflow, vertically arranged.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#216960"/></marker></defs>
<rect width="480" height="800" fill="#fff"/>
<g font-family="Arial, sans-serif">
<text x="30" y="32" fill="#216960" font-size="14" font-weight="700" text-anchor="start">OFFLINE CONSTRUCTION</text>
<rect x="30" y="60" width="420" height="135" rx="5" fill="#f4f7f5" stroke="#d8e2de"/>
<path d="M31 66V189" stroke="#216960" stroke-width="3"/>
<text x="48" y="89" fill="#172d33" font-size="20" font-weight="600" text-anchor="start">Source pairs</text>
<text x="48" y="116" fill="#52676d" font-size="15" font-weight="400" text-anchor="start">Image + original target mask</text>
<text x="48" y="139" fill="#52676d" font-size="15" font-weight="400" text-anchor="start">Source-specific preprocessing</text>
<text x="48" y="162" fill="#52676d" font-size="15" font-weight="400" text-anchor="start">and 2D sample extraction</text>
<path d="M240 195V230" fill="none" stroke="#216960" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="230" width="420" height="135" rx="5" fill="#f4f7f5" stroke="#d8e2de"/>
<path d="M31 236V359" stroke="#216960" stroke-width="3"/>
<text x="48" y="259" fill="#172d33" font-size="20" font-weight="600" text-anchor="start">Language construction</text>
<text x="48" y="286" fill="#52676d" font-size="15" font-weight="400" text-anchor="start">Target metadata + visual aids</text>
<text x="48" y="309" fill="#52676d" font-size="15" font-weight="400" text-anchor="start">QA prompt requirements</text>
<text x="48" y="332" fill="#52676d" font-size="15" font-weight="400" text-anchor="start">Question + reference answer</text>
<path d="M240 365V400" fill="none" stroke="#216960" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="400" width="420" height="135" rx="5" fill="#f4f7f5" stroke="#d8e2de"/>
<path d="M31 406V529" stroke="#216960" stroke-width="3"/>
<text x="48" y="429" fill="#172d33" font-size="20" font-weight="600" text-anchor="start">Checks and review</text>
<text x="48" y="456" fill="#52676d" font-size="15" font-weight="400" text-anchor="start">Format / completeness checks</text>
<text x="48" y="479" fill="#52676d" font-size="15" font-weight="400" text-anchor="start">Model recheck (reported)</text>
<text x="48" y="502" fill="#52676d" font-size="15" font-weight="400" text-anchor="start">Expert sampling (reported)</text>
<path d="M240 535V570" fill="none" stroke="#216960" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="570" width="420" height="135" rx="5" fill="#f4f7f5" stroke="#d8e2de"/>
<path d="M31 576V699" stroke="#216960" stroke-width="3"/>
<text x="48" y="599" fill="#172d33" font-size="20" font-weight="600" text-anchor="start">Structured records</text>
<text x="48" y="626" fill="#52676d" font-size="15" font-weight="400" text-anchor="start">image / input / output / mask</text>
<text x="48" y="649" fill="#52676d" font-size="15" font-weight="400" text-anchor="start">Auxiliary target metadata</text>
<text x="48" y="672" fill="#52676d" font-size="15" font-weight="400" text-anchor="start">Split manifests</text>
<text x="30" y="777" fill="#9a4b2d" font-size="16" font-weight="400" text-anchor="start">Offline visual aids are not inference inputs.</text>
</g></svg>
