<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">MedSPAR code-derived method overview</title><desc id="desc">TC-MVE supplies a compressed prefix to the LLM, a full grid to ACSG, and direct image embeddings to the SAM decoder. SGPA produces geometric and semantic prompts. No data or predictions are illustrated.</desc>
