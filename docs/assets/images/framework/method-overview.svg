<text x="425" y="35" fill="#216960" font-size="12" font-weight="700" text-anchor="start">ANSWER-CONDITIONED GROUNDING</text>
<text x="875" y="35" fill="#216960" font-size="12" font-weight="700" text-anchor="start">PROMPT ADAPTATION</text>
