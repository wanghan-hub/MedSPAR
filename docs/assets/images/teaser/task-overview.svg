<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">MedSPAR task schematic</title><desc id="desc">Text-only task diagram. No real or synthetic medical image, mask or experimental prediction is displayed.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#216960"/></marker></defs>
<rect width="1200" height="360" fill="#fff"/>
