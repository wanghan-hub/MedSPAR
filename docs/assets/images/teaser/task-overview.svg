<path d="M891 71V149" stroke="#216960" stroke-width="3"/>
<text x="908" y="94" fill="#172d33" font-size="20" font-weight="600" text-anchor="start">Generated answer</text>
<text x="908" y="121" fill="#52676d" font-size="15" font-weight="400" text-anchor="start">Exactly one valid [SEG]</text>
<rect x="890" y="177" width="270" height="90" rx="5" fill="#f4f7f5" stroke="#d8e2de"/>
<path d="M891 183V261" stroke="#216960" stroke-width="3"/>
