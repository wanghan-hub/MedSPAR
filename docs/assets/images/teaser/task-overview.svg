<path d="M456 119V226" stroke="#216960" stroke-width="3"/>
<text x="473" y="142" fill="#172d33" font-size="20" font-weight="600" text-anchor="start">MedSPAR</text>
<text x="473" y="169" fill="#52676d" font-size="15" font-weight="400" text-anchor="start">Question-conditioned segmentation</text>
<text x="473" y="192" fill="#52676d" font-size="15" font-weight="400" text-anchor="start">with automatic spatial prompts</text>
<path d="M340 110H396V153H455" fill="none" stroke="#216960" stroke-width="2" marker-end="url(#arrow)"/>
