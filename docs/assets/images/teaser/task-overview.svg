<text x="890" y="39" fill="#216960" font-size="12" font-weight="700" text-anchor="start">OUTPUT</text>
<rect x="40" y="65" width="300" height="90" rx="5" fill="#f4f7f5" stroke="#d8e2de"/>
<path d="M41 71V149" stroke="#216960" stroke-width="3"/>
